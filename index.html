  <style>
    @import url("https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap");

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      background-color: black;
      color: white;
      font-family: "Permanent Marker", cursive;
      overflow-x: hidden;
    }

    .schedule-tabs {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Hide the radio buttons */
    .schedule-tabs input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* Small date tabs */
    .tab-labels {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      width: 100%;
      margin: 0 0 8px;
    }

    .tab-labels label {
      flex: 0 1 70px;
      min-width: 45px;
      max-width: 70px;
      padding: 3px 5px;
      border: 1px solid #c8102e;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }

    .tab-labels label:hover {
      background-color: #650817;
    }

    /* Active date tab */
    #day-1:checked ~ .tab-labels label[for="day-1"],
    #day-2:checked ~ .tab-labels label[for="day-2"],
    #day-3:checked ~ .tab-labels label[for="day-3"],
    #day-4:checked ~ .tab-labels label[for="day-4"],
    #day-5:checked ~ .tab-labels label[for="day-5"],
    #day-6:checked ~ .tab-labels label[for="day-6"],
    #day-7:checked ~ .tab-labels label[for="day-7"] {
      background-color: #c8102e;
      color: black;
      box-shadow: 0 0 6px #c8102e;
    }

    /* Hide all day sections */
    .tab-content {
      display: none;
    }

    /* Show the selected day */
    #day-1:checked ~ .content-area .day-1-content,
    #day-2:checked ~ .content-area .day-2-content,
    #day-3:checked ~ .content-area .day-3-content,
    #day-4:checked ~ .content-area .day-4-content,
    #day-5:checked ~ .content-area .day-5-content,
    #day-6:checked ~ .content-area .day-6-content,
    #day-7:checked ~ .content-area .day-7-content {
      display: block;
    }

    .day-title {
      margin: 3px 0 10px;
      color: #c8102e;
      font-size: 32px;
      text-align: center;
      animation: bloody 4s ease infinite alternate;
    }

    @keyframes bloody {
      0% {
        text-shadow: 0 1px 3px #c8102e;
      }

      100% {
        text-shadow:
          0 4px 3px #c8102e,
          0 8px 3px #c8102e,
          0 12px 3px #c8102e;
      }
    }

    .main-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      width: 100%;
      margin-bottom: 20px;
    }

    .left-side {
      flex: 0 0 34%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right-side {
      flex: 0 0 60%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr {
      width: 100%;
      text-align: center;
    }

    .qr h2 {
      margin: 0 0 5px;
      color: #c8102e;
      font-size: 44px;
    }

    .qr img {
      display: block;
      width: 190px;
      height: 190px;
      margin: 0 auto;
    }

    .qr a {
      display: block;
      margin-top: 8px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .qr a:hover {
      color: #c8102e;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: 2px solid #c8102e;
      background-color: white;
      box-shadow: 0 0 12px #c8102e;
    }

    .images {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 8px 0 20px;
      overflow-x: auto;
    }

    .person {
      flex: 0 0 115px;
      width: 115px;
      text-align: center;
    }

    .person img {
      display: block;
      width: 115px;
      height: 170px;
      object-fit: cover;
      border: 2px solid #c8102e;
      box-shadow: 0 0 8px #c8102e;
    }

    .person button {
      width: 100%;
      margin-top: 4px;
      padding: 5px 3px;
      background-color: transparent;
      border: 1px solid #c8102e;
      color: white;
      font-family: "Permanent Marker", cursive;
      font-size: 17px;
      cursor: default;
      text-shadow: 1px 1px #c8102e;
    }

    @media (max-width: 768px) {
      body {
        padding: 5px;
      }

      .tab-labels {
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 3px;
      }

      .tab-labels label {
        flex: 0 0 48px;
        min-width: 48px;
        padding: 2px 3px;
        font-size: 10px;
      }

      .day-title {
        font-size: 26px;
      }

      .main-section {
        flex-direction: column;
        gap: 15px;
      }

      .left-side,
      .right-side {
        flex: 1 1 100%;
        width: 100%;
      }

      .qr h2 {
        font-size: 36px;
      }

      .qr img {
        width: 165px;
        height: 165px;
      }

      .qr a {
        font-size: 17px;
      }

      iframe {
        height: 300px;
      }

      .images {
        justify-content: flex-start;
      }

      .person {
        flex: 0 0 85px;
        width: 85px;
      }

      .person img {
        width: 85px;
        height: 128px;
      }

      .person button {
        font-size: 12px;
      }
    }
  </style>
</head>
